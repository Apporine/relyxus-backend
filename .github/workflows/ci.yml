name: ci

on:
  # Every PR, including stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov=packages --cov-report=term-missing

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Gitleaks
        run: uvx pre-commit run gitleaks --all-files
