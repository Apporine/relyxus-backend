# CodeBuild buildspec — builds the API image and pushes to ECR (trial stack).
# Source: GitHub Actions uploads relyxus-deploy.zip to S3, then starts this project.
version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}"
      - export IMAGE_URI IMAGE_TAG
  build:
    commands:
      - echo "Building relyxus-api image..."
      - docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" -f Dockerfile .
  post_build:
    commands:
      - docker push "$IMAGE_URI:$IMAGE_TAG"
      - docker push "$IMAGE_URI:latest"
      - printf '{"imageUri":"%s:%s"}' "$IMAGE_URI" "$IMAGE_TAG" > imageDetail.json

artifacts:
  files:
    - imageDetail.json
