# Local development dependencies only (TSD-12.01: Compose is never production).
# Usage: docker compose up -d   then copy .env.example to .env
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: relyxus
      POSTGRES_PASSWORD: relyxus-local
      POSTGRES_DB: relyxus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relyxus -d relyxus"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
