# Alembic configuration for the Relyxus API database (MP-25.01).
# The database URL is never stored here: it comes from RELYXUS_DATABASE_URL.
# Run from services/api:  uv run alembic upgrade head

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
