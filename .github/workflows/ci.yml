name: ci

on:
  # Every PR, including stacked PRs whose base is another feature branch.
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Reference PostgreSQL 18 with pgvector (TSD-7.01); ephemeral, CI-only credentials.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: relyxus
          POSTGRES_PASSWORD: relyxus-ci
          POSTGRES_DB: relyxus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relyxus -d relyxus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RELYXUS_TEST_DATABASE_URL: postgresql+psycopg://relyxus:relyxus-ci@localhost:5432/relyxus_test
      RELYXUS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov=packages --cov-report=term-missing

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Gitleaks
        run: uvx pre-commit run gitleaks --all-files
