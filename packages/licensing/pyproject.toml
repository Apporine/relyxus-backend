[project]
name = "apporine-licensing"
version = "0.1.0"
description = "Apporine commercial licence schema and offline verifier (Licensing & Entitlement Spec v1.0)"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44,<50",
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"
