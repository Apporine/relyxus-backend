AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Trial CI/CD for relyxus-backend — ECR, CodeBuild, S3 source bucket, GitHub OIDC role.
  Deploy from an account where org SCP allows codebuild, ecr, cloudformation, and s3.

Parameters:
  GitHubOrg:
    Type: String
    Default: Apporine
  GitHubRepo:
    Type: String
    Default: relyxus-backend
  AwsRegion:
    Type: String
    Default: us-east-1

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "relyxus-cicd-source-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: relyxus/api
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE

  CicdLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /relyxus/cicd/deployments
      RetentionInDays: 90

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /relyxus/cicd/codebuild
      RetentionInDays: 90

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: relyxus-trial-codebuild
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: relyxus-trial-codebuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt ApiRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !GetAtt SourceBucket.Arn
                  - !Sub "${SourceBucket.Arn}/*"

  TrialBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: relyxus-trial-build
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AwsRegion
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: ECR_REPOSITORY
            Value: !Ref ApiRepository
      Source:
        Type: S3
        Location: !Sub "${SourceBucket}/placeholder.zip"
        BuildSpec: infra/aws/cicd/buildspec.yml
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 06d927fecd0a84aeba28aad1d808139470fe95c3

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: relyxus-github-actions-cicd
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:
        - PolicyName: relyxus-github-actions-cicd
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt CicdLogGroup.Arn
                  - !Sub "${CicdLogGroup.Arn}:*"
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt TrialBuildProject.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${SourceBucket.Arn}/*"

Outputs:
  EcrRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AwsRegion}.amazonaws.com/${ApiRepository}"
  CodeBuildProjectName:
    Value: !Ref TrialBuildProject
  SourceBucketName:
    Value: !Ref SourceBucket
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
  DeploymentsLogGroup:
    Value: !Ref CicdLogGroup
  ConsoleCodeBuild:
    Value: !Sub "https://${AwsRegion}.console.aws.amazon.com/codesuite/codebuild/projects/${TrialBuildProject}/history?region=${AwsRegion}"
  ConsoleCloudWatchDeployments:
    Value: !Sub "https://${AwsRegion}.console.aws.amazon.com/cloudwatch/home?region=${AwsRegion}#logsV2:log-groups/log-group/${CicdLogGroup}"
