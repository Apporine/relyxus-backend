[project]
name = "relyxus-api"
version = "0.1.0"
description = "Relyxus public REST API: auth context, tenancy, request coordination (TSD §6)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.118,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "uvicorn[standard]>=0.37,<1",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"
