AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Trial CI/CD for relyxus-backend: ECR repository, deployment log group and a GitHub OIDC
  role that may push the API image. Needs an account whose org SCP allows IAM OIDC providers;
  account 925234975399 denies them, so it uses scripts/setup-ecr-push.ps1 instead.

Parameters:
  GitHubOrg:
    Type: String
    Default: Apporine
  GitHubRepo:
    Type: String
    Default: relyxus-backend
  AwsRegion:
    Type: String
    Default: ap-southeast-2

Resources:
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: relyxus/api
      ImageScanningConfiguration:
        ScanOnPush: true
      # `latest` is re-pointed on every build; commit-SHA tags are never reused.
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        # Same rules as ../ecr-lifecycle-policy.json.
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Remove untagged images after 1 day",
          "selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},
          "action":{"type":"expire"}},{"rulePriority":2,"description":"Keep the 10 most recent tagged builds",
          "selection":{"tagStatus":"tagged","tagPatternList":["*"],"countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}

  CicdLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /relyxus/cicd/deployments
      RetentionInDays: 90

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 06d927fecd0a84aeba28aad1d808139470fe95c3

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: relyxus-github-actions-cicd
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:
        - PolicyName: relyxus-github-actions-cicd
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt CicdLogGroup.Arn
                  - !Sub "${CicdLogGroup.Arn}:*"
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !GetAtt ApiRepository.Arn

Outputs:
  EcrRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AwsRegion}.amazonaws.com/${ApiRepository}"
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
  DeploymentsLogGroup:
    Value: !Ref CicdLogGroup
  ConsoleEcr:
    Value: !Sub "https://${AwsRegion}.console.aws.amazon.com/ecr/repositories/private/${AWS::AccountId}/${ApiRepository}?region=${AwsRegion}"
